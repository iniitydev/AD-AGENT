[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-runner"
version = "0.1.0"
description = "A universal, manifest-driven runner for setting up and running AI projects."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "Jinja2>=3.0",
]

[project.scripts]
ai-runner = "ai_runner.__main__:main"
