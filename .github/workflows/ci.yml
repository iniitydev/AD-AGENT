# .github/workflows/ci.yml
name: Python Application CI

on:
  push:
    branches: [ main, master, develop ] # Adjust branches as needed
  pull_request:
    branches: [ main, master, develop ] # Adjust branches as needed

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"] # Specify Python versions to test against

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Cache pip dependencies

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics --ignore=E203,W503

    - name: Format with black (check only)
      run: |
        black --check --diff --line-length 120 .

    # - name: Test with pytest (Optional, if tests are set up)
    #   run: |
    #     # This assumes you have tests in a 'tests/' directory and are using pytest
    #     # Ensure pytest and any necessary plugins (like pytest-cov) are in requirements.txt
    #     # Example:
    #     # pip install pytest pytest-cov
    #     # pytest tests/ --cov=src --cov-report=xml
    #     echo "Pytest execution would go here if tests/ directory and test files were populated."
    #     # As a placeholder, we'll just ensure the agent can be invoked for help
    #     python -m src.main --help
    #     python -m src.main train --help # Check specific command
    #     python -m src.main predict --help
    #     python -m src.main serve --help
    #     python -m src.main config --help


    - name: Verify Integrity Manifest (Optional - if script is ready and manifest exists)
      run: |
        # This step assumes 'sovereign_manifest.json' is committed or generated by a prior step.
        # If 'sovereign_manifest.json' is not meant to be in the repo, this step might need adjustment
        # or be part of a build process that generates it.
        # For now, we check if the script runs. The script itself handles missing manifest.
        echo "Attempting to run integrity verification script..."
        if [ -f "sovereign_manifest.json" ]; then
          python scripts/verify_integrity.py verify
        else
          echo "Skipping manifest verification: sovereign_manifest.json not found."
          echo "Generating a new manifest for future runs (not checked here):"
          python scripts/verify_integrity.py generate
        fi

    # Optional: Build Docker image (good for ensuring Dockerfile is valid)
    - name: Build Docker image
      run: |
        # Create dummy .env file if it's expected by Dockerfile or docker-compose build context
        if [ ! -f .env ]; then
          echo "Creating dummy .env file for Docker build"
          cp .env.example .env
        fi
        # Create dummy data/models directories if docker-compose expects them for volumes
        mkdir -p data models
        docker build . --file Dockerfile --tag sovereign-ad-agent:ci-${{ github.sha }}
        # docker-compose build agent # Alternative using docker-compose

    # Add other steps like deploying to a staging environment, etc.
    # For example, if you had actual tests:
    # - name: Run Tests via Makefile (if tests are containerized)
    #   run: |
    #     # Ensure services are up if tests depend on them
    #     # make up
    #     # make test
    #     # make down
    #     echo "Skipping 'make test' as it requires Docker-in-Docker or specific setup for CI"

